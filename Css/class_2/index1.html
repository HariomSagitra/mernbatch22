<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .container{
            display: flex;
            height: 700px;
            width: 600px;
            border: 2px solid black;
            justify-content: space-around; 
            justify-content: space-evenly;
            justify-content: center;
            /* align-items: end;*/
            align-items: center; 
            flex-wrap:wrap; 
            column-gap: 50px;
            row-gap: 50px;
            flex-direction: column;
            
        }

        .box{
            height: 50px;
            width: 50px;
            border: 2px solid red;
            background-color: lightblue;
            margin: 10px;
            float: left;
            flex-basis: 50px;
        }

        #item3{
            order: 1;
        }
    </style>
</head>

<body>
    <div class="container">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box" id="item3">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
        </div>
    
</body>
</html>
